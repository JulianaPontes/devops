name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Rodar script
        run: python app.py

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Simulando deploy
        run: echo "Deploy realizado com sucesso 🚀"